name: Gerar APK FYAH Control

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        run: |
          unzip -o FYAH_Control_Android_CORRIGIDO.zip -d .

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar aplicativo
        run: |
          cd fyah-control
          gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: FYAH-Control-APK
          path: fyah-control/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
